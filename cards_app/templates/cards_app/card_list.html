{% extends '_base.html' %}


{% block content %}

    {% for card in cards %}
        <div class="card my-2" style="background-color: {{ card.card_type.bg_color }}">
            <div class="card-header">
                {{ card.name }}
            </div>
            <div class="card-body">
                {{ card.text }}
            </div>
            <div class="card-footer">
                {{ card.alt_text }}
            </div>
        </div>
    {% endfor %}




{% endblock content %}
