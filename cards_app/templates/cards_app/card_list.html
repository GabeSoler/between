{% extends '_base.html' %}


{% block content %}
<div class="row row-cols-1 row-cols-md-2 g-4 mt-3">
    {% for card in cards %}
        <div class="col">

        <div class="card my-2"
             style="background-color: {{ card.card_type.bg_color }};
                     height:12rem;">
            <div class="card-header fw-bold">
                {{ card.name }}
            </div>
            <div class="card-body">
                {{ card.text }}
            </div>
            <div class="card-footer">
                {{ card.alt_text }}
            </div>
        </div>
                </div>

    {% endfor %}
</div>




{% endblock content %}
