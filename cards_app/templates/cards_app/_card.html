
<li class="col-4 mx-auto " >
<div class="card my-2 mx-auto"
      style="background-color: {{ card.card_type.bg_color }};
              height:12rem;">
    <div class="card-header fw-bold">
        {{ card.name }}
    </div>
    <div class="card-body fst-italic">
        {{ card.text }}
    </div>
    <div class="card-footer">
        {{ card.alt_text }}
    </div>
</div>
</li>
